<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>질문 목록 보기</title>
</head>
<body>
<table>
    <thead>
    <tr>
        <th>제목</th>
        <th>작성자</th>
    </tr>
    </thead>
    <tbody>
        <tr th:each="question: ${questionList}">
            <td th:text="${question.subject}"></td>
            <td th:text="${question.content}"></td>
        </tr>
    </tbody>
</table>
</body>
</html>
