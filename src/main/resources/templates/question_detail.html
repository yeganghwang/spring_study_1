<html lang="en" layout:decorate="~{layout}">
<head>
    <title th:text="${question.subject}">질문 상세보기</title>
</head>
<body>
<div layout:fragment="content" class="container my-3">
    <!--질문-->
    <h2 class="border-bottom py-2" th:text="${question.subject}">제목</h2>
    <div class="card my-3">
        <div class="card-body">
            <div class="card-text" style="white-space: pre-line" th:text="${question.content}">내용</div>
            <div class="d-flex justify-content-end">
                <div class="badge bg-light text-dark p-2 text-start">
                    <div th:text="${#temporals.format(question.createDate, 'yyyy-MM-dd HH:mm:ss')}">yyyy-MM-dd HH:mm:ss</div>
                </div>
            </div>
        </div>
    </div>
    <!--답변개수-->
    <h5 class="border-bottom my-3 py-2"
        th:text="|${#lists.size(question.answerList)}개의 답변이 있습니다.|"></h5>

    <!--답변 반복-->
    <div class="card my-3" th:each="answer: ${question.answerList}">
        <div class="card-body">
            <div class="card-text" style="white-space: pre-line;" th:text="${answer.content}"></div>
            <div class="d-flex justify-content-end">
                <div class="badge bg-light text-dark p-2 text-start">
                    <div th:text="${#temporals.format(answer.createDate, 'yyyy-MM-dd HH:mm:ss')}"></div>
                </div>
            </div>
        </div>
    </div>

    <!--제출란-->
    <form class="my-3" th:action="@{|/answer/create/${question.id}|}" th:object="${answerForm}" method="post">
        <div th:replace="~{form_errors :: formErrorsFragment}"></div>
        <label for="content"></label><textarea class="form-control" th:field="*{content}" rows="15"></textarea>
        <input class="btn btn-primary my-2" type="submit" value="답변등록">
    </form>
</div>

</body>
</html>
